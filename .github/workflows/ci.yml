name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # staticcheck v0.8.1 needs a Go 1.26 toolchain to build.
  GO_VERSION: "1.26"
  STATICCHECK_VERSION: "v0.8.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          staticcheck ./...

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.23 is the oldest release go.mod claims to support, so it is
        # tested rather than assumed.
        go: ["1.23", "1.26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go test
        run: go test -race -count=1 ./...

  bench:
    name: benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The benchmarks are a separate module and are far too slow to run on
      # every push, but they still have to keep compiling against the engine.
      - name: vet the benchmark module
        working-directory: bench
        run: |
          go build ./...
          go vet ./...
          go test -run . -bench . -benchtime 1x -count 1 ./...

  crash:
    name: crash injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The suite runs a reduced number of crash points as part of the normal
      # test job. This one runs the full 200, which takes minutes rather than
      # seconds, so it gets a job of its own.
      - name: kill and recover 200 times
        run: go test -count=1 -timeout 20m -v -run TestCrashRecovery ./internal/crash/
        env:
          EMBER_CRASH_ITERS: 200

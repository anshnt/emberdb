<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="860" height="470" rx="10" fill="#0d1117"/>
  <text x="34" y="42" fill="#ff8c42" font-size="15" font-weight="600">Page layout</text>
  <text x="160" y="42" fill="#6e7a88" font-size="12">every page is 4096 bytes</text>

  <!-- header page -->
  <text x="34" y="82" fill="#c9d1d9" font-size="13" font-weight="600">Page 0 — the file header</text>
  <rect x="34" y="94" width="792" height="52" rx="5" fill="#12161c" stroke="#21262d"/>
  <rect x="34" y="94" width="99" height="52" rx="5" fill="#1b1206" stroke="#5a3a12"/>
  <rect x="430" y="94" width="99" height="52" fill="#1b1206" stroke="#5a3a12"/>
  <text x="84" y="118" fill="#ff8c42" font-size="11" text-anchor="middle">slot A</text>
  <text x="84" y="134" fill="#8b949e" font-size="10" text-anchor="middle">64 bytes</text>
  <text x="480" y="118" fill="#ff8c42" font-size="11" text-anchor="middle">slot B</text>
  <text x="480" y="134" fill="#8b949e" font-size="10" text-anchor="middle">64 bytes</text>
  <text x="281" y="124" fill="#484f58" font-size="10" text-anchor="middle">unused</text>
  <text x="678" y="124" fill="#484f58" font-size="10" text-anchor="middle">unused</text>
  <text x="34" y="162" fill="#484f58" font-size="10">0</text>
  <text x="430" y="162" fill="#484f58" font-size="10">2048</text>
  <text x="826" y="162" fill="#484f58" font-size="10" text-anchor="end">4095</text>
  <text x="34" y="182" fill="#8b949e" font-size="11">Checkpoints alternate between the slots, so a torn write can only destroy the one that was not live. The 2 KiB gap</text>
  <text x="34" y="198" fill="#8b949e" font-size="11">keeps them off the same disk sector. Each is CRC32-C checksummed; the highest valid LSN wins.</text>

  <!-- btree node -->
  <text x="34" y="240" fill="#c9d1d9" font-size="13" font-weight="600">A B+tree node</text>
  <rect x="34" y="252" width="792" height="52" rx="5" fill="#12161c" stroke="#21262d"/>
  <rect x="34" y="252" width="110" height="52" rx="5" fill="#161b22" stroke="#30363d"/>
  <rect x="144" y="252" width="150" height="52" fill="#131a26" stroke="#2a3a52"/>
  <rect x="540" y="252" width="286" height="52" rx="5" fill="#141d17" stroke="#274a33"/>
  <text x="89" y="276" fill="#c9d1d9" font-size="11" text-anchor="middle">header</text>
  <text x="89" y="292" fill="#8b949e" font-size="10" text-anchor="middle">16 bytes</text>
  <text x="219" y="276" fill="#79c0ff" font-size="11" text-anchor="middle">slot directory</text>
  <text x="219" y="292" fill="#8b949e" font-size="10" text-anchor="middle">uint16 each, key order</text>
  <text x="417" y="282" fill="#484f58" font-size="10" text-anchor="middle">free space</text>
  <text x="683" y="276" fill="#7ee787" font-size="11" text-anchor="middle">cells</text>
  <text x="683" y="292" fill="#8b949e" font-size="10" text-anchor="middle">packed against the end, no gaps</text>
  <g stroke="#2a3a52" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M300 278 L360 278"/>
  </g>
  <g stroke="#274a33" stroke-width="1.2" fill="none" marker-end="url(#b)">
    <path d="M534 278 L474 278"/>
  </g>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#2a3a52"/></marker>
    <marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#274a33"/></marker>
  </defs>
  <text x="34" y="332" fill="#8b949e" font-size="11">Slot offsets strictly descend, so cell i runs from slot[i] up to slot[i-1]. Every mutation rewrites the whole cell area,</text>
  <text x="34" y="348" fill="#8b949e" font-size="11">which is why there is never a gap between cells and a cell never has to carry its own length.</text>

  <!-- wal record -->
  <text x="34" y="390" fill="#c9d1d9" font-size="13" font-weight="600">A log record</text>
  <rect x="34" y="402" width="792" height="40" rx="5" fill="#12161c" stroke="#21262d"/>
  <rect x="34" y="402" width="96" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
  <rect x="130" y="402" width="96" height="40" fill="#1b1206" stroke="#5a3a12"/>
  <rect x="226" y="402" width="80" height="40" fill="#161b22" stroke="#30363d"/>
  <rect x="306" y="402" width="120" height="40" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="427" fill="#c9d1d9" font-size="11" text-anchor="middle">length</text>
  <text x="178" y="427" fill="#ff8c42" font-size="11" text-anchor="middle">CRC32-C</text>
  <text x="266" y="427" fill="#c9d1d9" font-size="11" text-anchor="middle">type</text>
  <text x="366" y="427" fill="#c9d1d9" font-size="11" text-anchor="middle">transaction id</text>
  <text x="626" y="427" fill="#8b949e" font-size="11" text-anchor="middle">body — a whole 4 KiB page image, or the allocator state</text>
</svg>

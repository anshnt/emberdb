<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect width="860" height="400" rx="10" fill="#0d1117"/>
<text x="34" y="40" fill="#ff8c42" font-size="15" font-weight="600">Lower is better</text>
<text x="180" y="40" fill="#6e7a88" font-size="12">median of 5 runs, both engines fsyncing every commit, neither using prepared statements</text>
<rect x="34" y="56" width="12" height="12" rx="2" fill="#ff8c42"/>
<text x="54" y="66" fill="#c9d1d9" font-size="12">emberdb</text>
<rect x="134" y="56" width="12" height="12" rx="2" fill="#58a6ff"/>
<text x="154" y="66" fill="#c9d1d9" font-size="12">SQLite</text>
<text x="34" y="101" fill="#c9d1d9" font-size="12.5">Sequential insert</text>
<text x="34" y="118" fill="#6e7a88" font-size="11">per row</text>
<rect x="250" y="88" width="420.0" height="17" rx="3" fill="#ff8c42"/>
<rect x="250" y="109" width="289.4" height="17" rx="3" fill="#58a6ff"/>
<text x="679.0" y="101" fill="#8b949e" font-size="11">9.0 µs</text>
<text x="548.4" y="122" fill="#8b949e" font-size="11">6.2 µs</text>
<text x="826" y="112" fill="#6e7a88" font-size="11.5" text-anchor="end">SQLite 1.45×</text>
<text x="34" y="159" fill="#c9d1d9" font-size="12.5">Random insert</text>
<text x="34" y="176" fill="#6e7a88" font-size="11">per row</text>
<rect x="250" y="146" width="420.0" height="17" rx="3" fill="#ff8c42"/>
<rect x="250" y="167" width="347.2" height="17" rx="3" fill="#58a6ff"/>
<text x="679.0" y="159" fill="#8b949e" font-size="11">27.1 µs</text>
<text x="606.2" y="180" fill="#8b949e" font-size="11">22.4 µs</text>
<text x="826" y="170" fill="#6e7a88" font-size="11.5" text-anchor="end">SQLite 1.21×</text>
<text x="34" y="217" fill="#c9d1d9" font-size="12.5">Point read</text>
<text x="34" y="234" fill="#6e7a88" font-size="11">indexed lookup</text>
<rect x="250" y="204" width="358.9" height="17" rx="3" fill="#ff8c42"/>
<rect x="250" y="225" width="420.0" height="17" rx="3" fill="#58a6ff"/>
<text x="617.9" y="217" fill="#8b949e" font-size="11">13.9 µs</text>
<text x="679.0" y="238" fill="#8b949e" font-size="11">16.2 µs</text>
<text x="826" y="228" fill="#ff8c42" font-size="11.5" text-anchor="end">emberdb 1.17×</text>
<text x="34" y="275" fill="#c9d1d9" font-size="12.5">Range scan</text>
<text x="34" y="292" fill="#6e7a88" font-size="11">1000 rows</text>
<rect x="250" y="262" width="420.0" height="17" rx="3" fill="#ff8c42"/>
<rect x="250" y="283" width="358.6" height="17" rx="3" fill="#58a6ff"/>
<text x="679.0" y="275" fill="#8b949e" font-size="11">1.15 ms</text>
<text x="617.6" y="296" fill="#8b949e" font-size="11">978.8 µs</text>
<text x="826" y="286" fill="#6e7a88" font-size="11.5" text-anchor="end">SQLite 1.17×</text>
<text x="34" y="333" fill="#c9d1d9" font-size="12.5">Commit latency</text>
<text x="34" y="350" fill="#6e7a88" font-size="11">one row per transaction</text>
<rect x="250" y="320" width="420.0" height="17" rx="3" fill="#ff8c42"/>
<rect x="250" y="341" width="183.2" height="17" rx="3" fill="#58a6ff"/>
<text x="679.0" y="333" fill="#8b949e" font-size="11">333.9 µs</text>
<text x="442.2" y="354" fill="#8b949e" font-size="11">145.6 µs</text>
<text x="826" y="344" fill="#6e7a88" font-size="11.5" text-anchor="end">SQLite 2.29×</text>
<text x="34" y="378" fill="#484f58" font-size="11">Measured on an Intel Xeon at 2.10 GHz, Linux, go1.25, against modernc.org/sqlite. Each row is scaled to its own slower bar.</text>
</svg>